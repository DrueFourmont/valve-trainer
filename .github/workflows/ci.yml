name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Build first, so the test that checks the production bundle for leaked
      # test hooks has something to inspect.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
